name: Minimal Bevy agent

on:
  pull_request:
    paths:
      - "examples/bevy_agent/**"
      - "crates/rig-core/**"
      - "crates/rig-http/**"
      - "crates/rig-reqwest/**"
      - ".github/workflows/bevy-agent.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@v5
      - name: Isolate the agent toolchain
        run: |
          echo "RUSTUP_HOME=$GITHUB_WORKSPACE/.ci-rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.ci-cargo" >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format, test native patches and lint
        working-directory: examples/bevy_agent
        run: |
          cargo fmt -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      # Provider keys never enter CI. verify_live.py is an explicit local check.
