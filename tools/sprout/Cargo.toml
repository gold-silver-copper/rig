[package]
name = "sprout"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["native", "patch"]
resolver = "3"

[workspace.dependencies]
bevy_app = { version = "=0.20.0-rc.2", default-features = false, features = ["std", "hotpatching"] }
bevy_ecs = { version = "=0.20.0-rc.2", default-features = false, features = ["std", "hotpatching"] }
subsecond = "=0.7.10"
sprout-native = { path = "native" }

[dependencies]
anyhow = "1"
bevy = { version = "=0.20.0-rc.2", default-features = false, features = ["std", "async_executor", "multi_threaded", "hotpatching"] }
bevy_remote = { version = "=0.20.0-rc.2", default-features = false, features = ["http"] }
libloading = "0.8"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossbeam-channel = "0.5"
crossterm = "0.28"
rig-core = { path = "../../crates/rig-core", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsecond.workspace = true
sprout-native.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "io-util", "macros"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0
