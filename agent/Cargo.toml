[package]
name = "rig-pi"
version = "0.1.0"
edition = "2024"
publish = false
description = "A minimal self-reloading coding agent on Bevy and Rig."

# Its own workspace: Bevy 0.20 stays out of rig's lockfile, and the agent
# rebuilds itself with a plain `cargo build` in this directory.
[workspace]

[lib]
name = "rig_pi"
path = "src/lib.rs"

[[bin]]
name = "rig-pi"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.0-rc.2", default-features = false, features = ["std", "multi_threaded", "bevy_log"] }
bevy_remote = { version = "0.20.0-rc.2", default-features = false, features = ["http"] }
futures = "0.3"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time"] }
tracing = "0.1"
# Rig, by path: the agent may edit these crates and reload.
rig-core = { path = "../crates/rig-core", default-features = false, features = ["reqwest", "rustls"] }
rig-reqwest = { path = "../crates/rig-reqwest", default-features = false, features = ["rustls"] }
rig-memory = { path = "../crates/rig-memory", features = ["file"] }
rig-rmcp = { path = "../crates/rig-rmcp" }
rig-codemode = { path = "../crates/rig-codemode" }
rig-cassette = { path = "../crates/rig-cassette", default-features = false, features = ["http"] }
rmcp = { version = "2.2", features = ["client", "transport-child-process"] }
# Telemetry export.
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-json", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.33"

[dev-dependencies]
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
