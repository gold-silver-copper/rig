[package]
name = "bevy-agent"
version = "0.1.0"
edition = "2024"
publish = false
description = "A minimal self-reloading coding agent on Bevy, Rig and ratatui"

# Its own workspace: the agent is not a member of the Rig workspace, so it
# keeps its own lockfile and target directory and never touches Rig's.
[workspace]

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
bevy = { version = "=0.20.0-rc.2", default-features = false, features = ["std", "multi_threaded", "async_executor"] }
# Depended on directly: `bevy/bevy_remote` turns on bevy_remote's default
# features, which pull in the renderer.
bevy_remote = { version = "=0.20.0-rc.2", default-features = false, features = ["http"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rig-core = { path = "../crates/rig-core", features = ["reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "io-util"] }
