[package]
name = "bevy-coding-agent"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[workspace]

[dependencies]
anyhow = "1"
bevy = { version = "=0.20.0-rc.2", default-features = false, features = ["std", "async_executor", "multi_threaded", "hotpatching"] }
bevy_remote = { version = "=0.20.0-rc.2", default-features = false, features = ["http"] }
rig-core = { path = "../../crates/rig-core", default-features = false, features = ["reqwest", "rustls"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsecond = "=0.7.10"
libloading = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "fs", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
