[package]
name = "rig-codemode"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "Code mode for Rig: model-written JavaScript whose only capability is calling tools."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false }
serde_json = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rquickjs = "0.14"
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
