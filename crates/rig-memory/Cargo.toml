[package]
name = "rig-memory"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "Conversation memory policies (sliding window, token budget, ...) for the Rig agent framework."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
# `FileConversationMemory`: JSON Lines files on the local filesystem.
# Native-only; the module is compiled out on wasm.
file = ["dep:serde_json"]

[dev-dependencies]
# Self-dependency: every test target compiles with the `file` backend.
rig-memory = { path = ".", features = ["file"] }
rig-core = { path = "../rig-core", version = "0.43.0", features = ["reqwest"] }
anyhow = { workspace = true }
assert_fs = { workspace = true }
rig-agent.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[[example]]
name = "agent_with_memory_policies"
required-features = []
