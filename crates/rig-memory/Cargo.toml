[package]
name = "rig-memory"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "Conversation memory policies (sliding window, token budget, ...) for the Rig agent framework."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
# `FileConversationMemory`, a JSON Lines backend on the local file system.
# Native targets only.
file = ["dep:serde_json"]

[dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false }
tracing = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
assert_fs = { workspace = true }
rig-core = { path = "../rig-core", version = "0.43.0", features = ["reqwest"] }
anyhow = { workspace = true }
rig-agent.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[[example]]
name = "agent_with_memory_policies"
required-features = []
