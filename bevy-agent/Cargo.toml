[package]
name = "bevy-agent"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["hotpatch"]

[dependencies]
agent-hotpatch = { path = "hotpatch" }
anyhow = "1"
async-channel = "2"
bevy_app = { version = "0.20.0-rc.2" }
bevy_ecs = { version = "0.20.0-rc.2", features = ["hotpatching"] }
bevy_reflect = { version = "0.20.0-rc.2" }
bevy_remote = { version = "0.20.0-rc.2", default-features = false, features = ["http"] }
bevy_tasks = { version = "0.20.0-rc.2", features = ["multi_threaded"] }
crossterm = "0.29"
ratatui = "0.30"
rig-core = { path = "../crates/rig-core", features = ["reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsecond = "0.7.10"

[profile.dev]
# Patches are linked from the tip crate's incremental objects; keep them small.
opt-level = 0
